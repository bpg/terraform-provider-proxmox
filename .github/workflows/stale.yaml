name: Manage Stale Items

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and pull requests
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-stale: 60
          days-before-close: 7

          stale-issue-label: stale
          stale-pr-label: stale

          stale-issue-message: >
            This issue has been marked stale due to inactivity. It will be closed
            in 7 days unless there is a new comment or the stale label is removed.
          stale-pr-message: >
            This pull request has been marked stale due to inactivity. It will be
            closed in 7 days unless there is a new comment or the stale label is removed.

          close-issue-message: >
            Closing this issue because it remained stale without activity.
          close-pr-message: >
            Closing this pull request because it remained stale without activity.

          remove-stale-when-updated: true
          delete-branch: false
