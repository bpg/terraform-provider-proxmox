# This GitHub action attaches, signs and publishes the assets of a release when its tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
#
# This uses an action (crazy-max/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
name: Publish Release

on:
  push:
    tags:
      - "v*"

# Releases are immutable: release-please creates the release as a draft (with its tag), the goreleaser job
# attaches and signs the assets while it is still a draft, and the publish job publishes it last, after checking it.
# If any job fails the release stays a draft and nothing is public: fix the cause and use "Re-run all jobs".
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Find the release-please draft for this tag. Publishing is irreversible, so refuse anything ambiguous.
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      state: ${{ steps.find.outputs.state }}
      release_id: ${{ steps.find.outputs.release_id }}
    steps:
      - name: Generate Short Lived OAuth App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          owner: "${{ github.repository_owner }}"
          repositories: "${{ github.event.repository.name }}"
      - name: Find the draft release
        id: find
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          n=0
          # The tag is created before the draft release, so this workflow can start first: wait for it.
          for i in $(seq 1 24); do
            rels=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -s --arg t "$TAG" 'add | [.[] | select(.tag_name == $t)]') \
              || { echo "API error, retrying ($i/24)"; sleep 5; continue; }
            n=$(jq 'length' <<<"$rels")
            if [ "$n" -gt 1 ]; then
              echo "::error::$n releases match $TAG; refusing to guess"
              exit 1
            fi
            [ "$n" -eq 1 ] && break
            echo "waiting for the release-please draft for $TAG ($i/24)"
            sleep 5
          done
          [ "$n" -eq 1 ] || { echo "::error::no release found for $TAG. Once release-please has created the draft, use 'Re-run all jobs'."; exit 1; }

          draft=$(jq -r '.[0].draft' <<<"$rels")
          name=$(jq -r '.[0].name' <<<"$rels")
          id=$(jq -r '.[0].id' <<<"$rels")

          if [ "$draft" != "true" ]; then
            echo "::notice::$TAG is already published (and immutable); nothing to do"
            echo "state=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GoReleaser's use_existing_draft matches the draft by release NAME, and silently creates a second release on a miss.
          [ "$name" = "$TAG" ] || { echo "::error::draft name '$name' != tag '$TAG'"; exit 1; }

          echo "state=draft" >> "$GITHUB_OUTPUT"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: check
    if: needs.check.outputs.state == 'draft'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Generate Short Lived OAuth App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          owner: "${{ github.repository_owner }}"
          repositories: "${{ github.event.repository.name }}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: "${{ secrets.GPG_PRIVATE_KEY }}"
          passphrase: "${{ secrets.PASSPHRASE }}"
          # Signing subkey of the master key; the primary secret lives on a smartcard,
          # so the action must preset the passphrase for this subkey only.
          fingerprint: "DFE55260A45246244FACE9623FF640C0C9ABD10F"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: "${{ steps.import_gpg.outputs.fingerprint }}"
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ./dist/*.zip
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"

      - name: Explain a failed run
        if: failure()
        run: echo "::error::Release $TAG is still a DRAFT and nothing is public. Fix the cause, then use 'Re-run all jobs'; the assets are replaced."

  # Publishing is irreversible (assets and tag lock), so verify the draft first.
  publish:
    needs: [check, goreleaser]
    if: needs.check.outputs.state == 'draft'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Generate Short Lived OAuth App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          owner: "${{ github.repository_owner }}"
          repositories: "${{ github.event.repository.name }}"
      - name: Checkout (for the public signing key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Verify the draft's assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
          # Primary key of the goreleaser job's signing subkey, so a subkey rotation doesn't change this.
          SIGNING_PRIMARY_FPR: F21132514C87DE5BB384667C0B3405B36193A495
        run: |
          set -euo pipefail
          PUBKEY="$GITHUB_WORKSPACE/.github/release-signing-key.pub.asc"
          mkdir -p "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json

          # an API edit of a draft that omits tag_name detaches the tag, and it would publish as `untagged-...`
          [ "$(jq -r .tag_name release.json)" = "$TAG" ] \
            || { echo "::error::the draft's tag_name is not $TAG (detached from its tag?). Repair: gh api -X PATCH repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID -f tag_name=$TAG"; exit 1; }

          # only fully uploaded assets count; the count check below catches a half-uploaded one
          jq -r '.assets[] | select(.state == "uploaded") | "\(.id) \(.name)"' release.json > list.txt
          while read -r aid name; do
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$name"
          done < list.txt

          sums=$(ls ./*_SHA256SUMS 2>/dev/null) || { echo "::error::no *_SHA256SUMS asset on the draft"; exit 1; }
          sums=${sums#./}
          [ -s "$sums.sig" ] || { echo "::error::missing $sums.sig"; exit 1; }

          # every file listed in SHA256SUMS, plus SHA256SUMS itself and its signature
          expected=$(( $(wc -l < "$sums") + 2 ))
          actual=$(wc -l < list.txt)
          [ "$actual" -eq "$expected" ] || { echo "::error::expected $expected assets, found $actual"; exit 1; }

          sha256sum -c "$sums"
          # verify with the public key only, and require the expected primary key (any key in a keyring would pass)
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import "$PUBKEY"
          verdict=$(gpg --batch --status-fd 1 --verify "$sums.sig" "$sums") || true
          awk -v fpr="$SIGNING_PRIMARY_FPR" '$1 == "[GNUPG:]" && $2 == "VALIDSIG" && $NF == fpr { ok = 1 } END { exit !ok }' <<<"$verdict" \
            || { echo "::error::signature is not valid for primary key $SIGNING_PRIMARY_FPR (signing subkey rotated? update .github/release-signing-key.pub.asc and the import fingerprint)"; exit 1; }

          [ -n "$(jq -r '.body // empty' release.json)" ] || { echo "::error::release notes are empty"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
        run: |
          set -euo pipefail
          out=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f tag_name="$TAG" \
            --jq '"published \(.tag_name): draft=\(.draft) immutable=\(.immutable)"')
          echo "$out"
          grep -q 'immutable=true' <<<"$out" || echo "::warning::$TAG was published but is not immutable; is the repository setting on?"

      - name: Explain a failed run
        if: failure()
        run: echo "::error::Release $TAG was NOT published and is still a draft. Fix the cause, then use 'Re-run all jobs' (a failed gate needs the assets re-uploaded)."
